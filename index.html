<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        canvas {
            background-color: #2e8b57;
            border: 2px solid #10b981;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        button {
            background: #6d28d9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }
        
        button:hover {
            background: #5b21b6;
        }
        
        .score-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        #restartSnake {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .game-over-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 5;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .game-over-text {
            font-size: 36px;
            margin-bottom: 10px;
            color: white;
        }
        
        .final-score {
            font-size: 24px;
            margin-bottom: 20px;
            color: white;
        }
        
        .instructions {
            margin-top: 15px;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="score-container">
        <div class="score" id="snakeScore">Score: 0</div>
        <div class="high-score" id="snakeHighScore">High Score: 0</div>
    </div>
    <canvas id="snakeCanvas" width="400" height="400" tabindex="0"></canvas>
    <div class="controls">
        <button id="restartSnake">Play Again</button>
    </div>
    
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-text">GAME OVER</div>
        <div class="final-score" id="finalScore">Score: 0</div>
    </div>
    
    <div class="instructions">
        Use arrow keys to move
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('snakeScore');
        const highScoreElement = document.getElementById('snakeHighScore');
        const restartButton = document.getElementById('restartSnake');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreElement = document.getElementById('finalScore');

        // Focus canvas for keyboard events
        canvas.focus();

        // Game variables
        const gridSize = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5, type: 'apple'};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameOver = false;
        let gameSpeed = 150;
        let gameLoopId;
        let changingDirection = false;
        const foodTypes = ['apple', 'banana', 'grape', 'orange'];

        // Initialize game
        function init() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            gameOver = false;
            changingDirection = false;
            gameSpeed = 150;
            scoreElement.textContent = `Score: ${score}`;
            highScoreElement.textContent = `High Score: ${highScore}`;
            restartButton.style.display = 'none';
            gameOverOverlay.style.display = 'none';
            placeFood();
            
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(main, gameSpeed);
        }

        // Main game loop
        function main() {
            if (gameOver) {
                clearInterval(gameLoopId);
                showGameOver();
                return;
            }
            
            setTimeout(() => {
                changingDirection = false;
                moveSnake();
                if (checkCollision()) {
                    gameOver = true;
                    return;
                }
                
                if (checkFoodCollision()) {
                    score += 1; // All foods give exactly 1 point
                    scoreElement.textContent = `Score: ${score}`;
                    
                    // Update high score
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = `High Score: ${highScore}`;
                        localStorage.setItem('snakeHighScore', highScore);
                    }
                    
                    // Increase speed every 50 points
                    if (score % 50 === 0 && gameSpeed > 50) {
                        gameSpeed -= 10;
                        clearInterval(gameLoopId);
                        gameLoopId = setInterval(main, gameSpeed);
                    }
                    
                    placeFood();
                }
                
                clearCanvas();
                drawSnake();
                drawFood();
                drawScore();
            }, 0);
        }

        function showGameOver() {
            finalScoreElement.textContent = `Score: ${score}`;
            gameOverOverlay.style.display = 'flex';
            restartButton.style.display = 'block';
        }

        // Draw functions
        function clearCanvas() {
            // Grass background
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid pattern
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                // Snake head
                if (index === 0) {
                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    
                    // Eyes
                    ctx.fillStyle = 'white';
                    if (dx === 1) { // Right
                        ctx.fillRect(segment.x * gridSize + gridSize - 6, segment.y * gridSize + 5, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 6, segment.y * gridSize + gridSize - 9, 4, 4);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 5, 4, 4);
                        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + gridSize - 9, 4, 4);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 2, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 9, segment.y * gridSize + 2, 4, 4);
                    } else { // Down
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + gridSize - 6, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 9, segment.y * gridSize + gridSize - 6, 4, 4);
                    }
                    
                    // Tongue when moving
                    if (dx !== 0 || dy !== 0) {
                        ctx.fillStyle = '#ef4444';
                        if (dx === 1) { // Right
                            ctx.fillRect(segment.x * gridSize + gridSize, segment.y * gridSize + gridSize/2 - 1, 4, 2);
                        } else if (dx === -1) { // Left
                            ctx.fillRect(segment.x * gridSize - 4, segment.y * gridSize + gridSize/2 - 1, 4, 2);
                        } else if (dy === -1) { // Up
                            ctx.fillRect(segment.x * gridSize + gridSize/2 - 1, segment.y * gridSize - 4, 2, 4);
                        } else if (dy === 1) { // Down
                            ctx.fillRect(segment.x * gridSize + gridSize/2 - 1, segment.y * gridSize + gridSize, 2, 4);
                        }
                    }
                } 
                // Snake body
                else {
                    ctx.fillStyle = '#34d399';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                }
                
                ctx.strokeStyle = '#065f46';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
        }

        function drawFood() {
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            const radius = gridSize / 2;
            
            switch(food.type) {
                case 'apple':
                    // Red apple
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Apple stem
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(centerX - 2, centerY - radius - 3, 4, 6);
                    break;
                    
                case 'banana':
                    // Yellow banana
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY, radius, radius/1.5, Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Banana ends
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.arc(centerX - radius/2, centerY - radius/2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                    
                case 'grape':
                    // Purple grapes
                    ctx.fillStyle = '#9b59b6';
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 2; j++) {
                            ctx.beginPath();
                            ctx.arc(
                                centerX - radius/2 + i * radius/2, 
                                centerY - radius/2 + j * radius/2, 
                                radius/3, 
                                0, 
                                Math.PI * 2
                            );
                            ctx.fill();
                        }
                    }
                    break;
                    
                case 'orange':
                default:
                    // Orange fruit
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Segment lines
                    ctx.strokeStyle = '#d35400';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 6; i++) {
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(
                            centerX + Math.cos(i * Math.PI/3) * radius,
                            centerY + Math.sin(i * Math.PI/3) * radius
                        );
                        ctx.stroke();
                    }
                    break;
            }
        }

        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Speed: ${Math.floor((150 - gameSpeed) / 10)}`, 10, 20);
        }

        // Game logic
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (!checkFoodCollision()) {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];
            
            // Wall collision
            if (head.x < 0 || head.x >= canvas.width/gridSize || 
                head.y < 0 || head.y >= canvas.height/gridSize) {
                return true;
            }
            
            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function checkFoodCollision() {
            const head = snake[0];
            return head.x === food.x && head.y === food.y;
        }

        function placeFood() {
            const maxPos = canvas.width / gridSize;
            food = {
                x: Math.floor(Math.random() * maxPos),
                y: Math.floor(Math.random() * maxPos),
                type: foodTypes[Math.floor(Math.random() * foodTypes.length)]
            };
            
            // Make sure food doesn't appear on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return placeFood();
                }
            }
        }

        // Keyboard controls
        function changeDirection(e) {
            if (gameOver || changingDirection) return;
            changingDirection = true;
            
            const key = e.key;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;
            
            if (key === 'ArrowLeft' && !goingRight) {
                dx = -1;
                dy = 0;
            } else if (key === 'ArrowUp' && !goingDown) {
                dx = 0;
                dy = -1;
            } else if (key === 'ArrowRight' && !goingLeft) {
                dx = 1;
                dy = 0;
            } else if (key === 'ArrowDown' && !goingUp) {
                dx = 0;
                dy = 1;
            }
            
            // Prevent arrow keys from scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                e.preventDefault();
            }
        }

        // Event listeners
        canvas.addEventListener('keydown', changeDirection);
        restartButton.addEventListener('click', init);

        // Start game
        init();
    </script>
</body>
</html>
