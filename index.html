<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        canvas {
            background-color: #2e8b57;
            border: 2px solid #10b981;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background: #6d28d9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #5b21b6;
        }
        
        .score-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <div class="score-container">
        <div class="score" id="snakeScore">Score: 0</div>
        <div class="high-score" id="snakeHighScore">High Score: 0</div>
    </div>
    <canvas id="snakeCanvas" width="400" height="400" tabindex="0"></canvas>
    <div class="controls">
        <button id="restartSnake">Restart Game</button>
        <button id="backButton">Back to Menu</button>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('snakeScore');
        const highScoreElement = document.getElementById('snakeHighScore');
        const restartButton = document.getElementById('restartSnake');
        const backButton = document.getElementById('backButton');

        // Focus canvas for keyboard events
        canvas.focus();

        // Game variables
        const gridSize = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameOver = false;
        let gameSpeed = 150;
        let gameLoopId;
        let changingDirection = false;

        // Initialize game
        function init() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            gameOver = false;
            changingDirection = false;
            scoreElement.textContent = `Score: ${score}`;
            highScoreElement.textContent = `High Score: ${highScore}`;
            placeFood();
            
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(main, gameSpeed);
        }

        // Main game loop
        function main() {
            if (gameOver) {
                clearInterval(gameLoopId);
                return;
            }
            
            setTimeout(() => {
                changingDirection = false;
                moveSnake();
                if (checkCollision()) {
                    gameOver = true;
                    return;
                }
                
                if (checkFoodCollision()) {
                    growSnake();
                    placeFood();
                    score += 1; // Changed from 10 to 1
                    scoreElement.textContent = `Score: ${score}`;
                    
                    // Update high score
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = `High Score: ${highScore}`;
                        localStorage.setItem('snakeHighScore', highScore);
                    }
                    
                    // Increase speed every 10 points instead of 50
                    if (score % 10 === 0 && gameSpeed > 50) {
                        gameSpeed -= 10;
                        clearInterval(gameLoopId);
                        gameLoopId = setInterval(main, gameSpeed);
                    }
                }
                
                clearCanvas();
                drawSnake();
                drawFood();
                drawScore();
            }, 0);
        }

        // [Rest of the code remains exactly the same...]
        // (All the draw functions and game logic stay identical)
        // Only changed the scoring as requested

        // Draw functions
        function clearCanvas() {
            // Grass background
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid pattern
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                // Snake head
                if (index === 0) {
                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    
                    // Eyes
                    ctx.fillStyle = 'white';
                    if (dx === 1) { // Right
                        ctx.fillRect(segment.x * gridSize + gridSize - 6, segment.y * gridSize + 5, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 6, segment.y * gridSize + gridSize - 9, 4, 4);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 5, 4, 4);
                        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + gridSize - 9, 4, 4);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 2, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 9, segment.y * gridSize + 2, 4, 4);
                    } else { // Down
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + gridSize - 6, 4, 4);
                        ctx.fillRect(segment.x * gridSize + gridSize - 9, segment.y * gridSize + gridSize - 6, 4, 4);
                    }
                } 
                // Snake body
                else {
                    ctx.fillStyle = '#34d399';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                }
                
                ctx.strokeStyle = '#065f46';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
            
            // Game over overlay
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
                ctx.fillText(`SCORE: ${score}`, canvas.width/2, canvas.height/2 + 20);
            }
        }

        function drawFood() {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            const radius = gridSize / 2;
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Food details
            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.arc(centerX - 3, centerY - 3, 2, 0, Math.PI * 2);
            ctx.arc(centerX + 4, centerY - 1, 2, 0, Math.PI * 2);
            ctx.arc(centerX - 2, centerY + 3, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Speed: ${Math.floor((150 - gameSpeed) / 10)}`, 10, 20);
        }

        // Game logic
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (!checkFoodCollision()) {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];
            
            // Wall collision
            if (head.x < 0 || head.x >= canvas.width/gridSize || 
                head.y < 0 || head.y >= canvas.height/gridSize) {
                return true;
            }
            
            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function checkFoodCollision() {
            const head = snake[0];
            return head.x === food.x && head.y === food.y;
        }

        function growSnake() {
            // Snake grows by not removing tail when eating
        }

        function placeFood() {
            const maxPos = canvas.width / gridSize;
            food = {
                x: Math.floor(Math.random() * maxPos),
                y: Math.floor(Math.random() * maxPos)
            };
            
            // Make sure food doesn't appear on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return placeFood();
                }
            }
        }

        // Keyboard controls
        function changeDirection(e) {
            if (changingDirection) return;
            changingDirection = true;
            
            const key = e.key;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;
            
            if (key === 'ArrowLeft' && !goingRight) {
                dx = -1;
                dy = 0;
            } else if (key === 'ArrowUp' && !goingDown) {
                dx = 0;
                dy = -1;
            } else if (key === 'ArrowRight' && !goingLeft) {
                dx = 1;
                dy = 0;
            } else if (key === 'ArrowDown' && !goingUp) {
                dx = 0;
                dy = 1;
            }
            
            // Prevent arrow keys from scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                e.preventDefault();
            }
        }

        // Event listeners
        canvas.addEventListener('keydown', changeDirection);
        restartButton.addEventListener('click', init);
        backButton.addEventListener('click', () => {
            window.location.href = 'index.html'; // Change to your main page
        });

        // Start game
        init();
    </script>
</body>
</html>
